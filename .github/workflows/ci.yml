name: CI Backend Spring Boot - ElGustazo

on:
  push:
    branches: [ main, feature/mejoras-profesor ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar y verificar proyecto con Maven
        run: sh ./mvnw test-compile
